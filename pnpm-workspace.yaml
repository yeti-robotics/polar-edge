packages:
  - apps/*
  - packages/*

allowBuilds:
  '@swc/core': true
  cpu-features: false
  esbuild: true
  necord: true
  protobufjs: true
  sharp: true
  # ssh2's native binding and cpu-features are optional addons from scouting's testcontainers dependency.
  # ssh2's binding does not compile against Node 26's V8 API.
  ssh2: false
  workerd: true

autoInstallPeers: false

catalog:
  '@types/node': 26.6.5
  '@types/react': ^19.2.18
  '@types/react-dom': ^19.2.4
  '@vitest/coverage-v8': ^4.1.12
  ai: 7.0.65
  next: 16.3.8
  react: 19.2.4
  react-dom: 19.2.4
  tsdown: 0.21.7
  tsx: ^4.23.12
  typescript: ^6.0.3
  unplugin-swc: ^1.5.11
  vitest: ^4.1.12
  zod: ^4.4.3

overrides:
  # drizzle-kit pulls the deprecated @esbuild-kit/* packages, which pin an
  # esbuild with a dev-server CORS advisory. No upstream fix; drizzle-kit is a
  # devDependency, so force a patched esbuild.
  esbuild@<0.25.0: '>=0.25.0'
  # @swc/helpers >=0.5.17 adds a `module-sync` export condition. Under pnpm's
  # symlinked layout Next's file tracer copies only the cjs build into
  # `.next/standalone`, but Node >=22.10 honours `module-sync` and loads the
  # ESM build, which was never traced -- the standalone server dies at boot
  # with MODULE_NOT_FOUND on @swc/helpers/esm/*. 0.5.15 is the last version
  # without that condition and still exports every helper next/dist requires.
  # Scoped to next so @swc/core keeps its own version.
  next>@swc/helpers: 0.5.15
  js-yaml@^4: 4.3.2
  postcss-selector-parser@^6: 7.1.6
