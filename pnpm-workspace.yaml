packages:
  - apps/*
  - packages/*

catalog:
  '@types/node': 24.10.13
  '@types/react': ^19.2.18
  '@types/react-dom': ^19.2.4
  '@vitest/coverage-v8': ^4.1.10
  ai: 7.0.65
  next: 16.3.1
  react: 19.2.4
  react-dom: 19.2.4
  tsdown: 0.21.7
  tsx: ^4.23.12
  typescript: ^6.0.3
  unplugin-swc: ^1.5.11
  vitest: ^4.1.10
  zod: ^4.4.3

onlyBuiltDependencies:
  - '@swc/core'
  - esbuild
  - sharp
  - workerd

autoInstallPeers: false

overrides:
  # drizzle-kit pulls the deprecated @esbuild-kit/* packages, which pin an
  # esbuild with a dev-server CORS advisory. No upstream fix; drizzle-kit is a
  # devDependency, so force a patched esbuild.
  esbuild@<0.25.0: '>=0.25.0'
