name: Publish Docker Image

on:
  workflow_call:
    inputs:
      app:
        description: App directory and GHCR image name
        required: true
        type: string
      build_args:
        description: Optional nonsecret Docker build arguments
        required: false
        type: string
        default: ""

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Build and push ${{ inputs.app }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/${{ inputs.app }}
          flavor: latest=auto
          tags: |
            type=semver,pattern={{version}},match=^${{ inputs.app }}-v(.*)$

      - name: Require a valid release tag
        if: ${{ steps.meta.outputs.tags == '' }}
        run: |
          echo "::error::Invalid release tag: $GITHUB_REF_NAME"
          exit 1

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/${{ inputs.app }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: ${{ inputs.build_args }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
